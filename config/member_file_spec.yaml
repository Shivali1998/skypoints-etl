file_name_pattern: '^members_(?P<file_date>\d{8})(_\d{3})?\.dat$'   # optional _NNN chunk suffix
delimiter: "|"
# Assumption: spec table lists 11 fields (incl. Post Code) but header/detail
# records in the same document carry 10. The layout below follows the header record.
columns: [member_name, member_id, enrollment_date, last_flight_date, tier_code, agent_name, state, country, dob, is_active]
expected_field_count: 10
date_format: "YYYYMMDD"
dob_format: "DDMMYYYY"     # assumption: 03051985 = 3 May 1985; confirm with source owner
max_len: {member_name: 255, member_id: 18, tier_code: 5, agent_name: 255, state: 5, country: 5, is_active: 1}
mandatory: [member_name, member_id, enrollment_date]
member_id_regex: '^[0-9]{6,18}$'
tier_codes: [GLD, SLV, PLT]
active_flags: [A, I]
min_age: 0
max_age: 120
